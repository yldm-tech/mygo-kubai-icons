name: Release

# Releases main once CI has passed on it. semantic-release reads the conventional commits since the last tag: fix and perf make a patch release, feat a minor one, a breaking change a major one, and anything else none. It pushes the tag vX.Y.Z, which is all a Go module needs, and publishes a GitHub Release with the notes; it commits nothing back, so GITHUB_TOKEN is enough. The configuration is .releaserc.json.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# Two releases must not run at once: each picks the next version from the tags it sees. The one in flight is never cancelled, as it may already have tagged.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      # The commit CI passed on. When main has moved on since, semantic-release sees that it is behind and releases nothing; the newer commit's own run releases it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Release
        run: npx --yes -p semantic-release@25.0.9 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
