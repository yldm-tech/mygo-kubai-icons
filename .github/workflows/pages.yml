name: Pages

# Publishes the gallery example, compiled to WebAssembly, at https://kubai.yldm.ai/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the gallery for the browser
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: "0"
        run: |
          mkdir -p _site
          go build -trimpath -ldflags='-s -w' -o _site/gallery.wasm ./examples/gallery
          gzip -9 -n _site/gallery.wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/index.html .github/assets/logo.png .github/assets/social-preview.png _site/
          ls -l _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
