<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kubai Icons for MyGo</title>
    <meta name="description" content="The 2,871 Kubai Icons for MyGo native UI, moving on hover. This gallery is the repository's native example, compiled to WebAssembly and drawn by MyGo." />
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; background: #fff; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #6b7280;
      }
      a { color: #3b82f6; }
      .spinner { width: 24px; height: 24px; animation: spin 1s steps(12) infinite; }
      .spinner line { stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error { max-width: 80%; text-align: center; }
    </style>
  </head>
  <body>
    <!-- The gallery is examples/gallery, a MyGo native UI app built for GOOS=js by .github/workflows/pages.yml. MyGo replaces this page's content with its own once it runs. -->
    <svg class="spinner" viewBox="0 0 24 24" role="progressbar" aria-label="Loading the gallery">
      <g transform="translate(12 12)">
        <line y1="-5.5" y2="-10" opacity="1" />
        <line y1="-5.5" y2="-10" opacity="0.92" transform="rotate(-30)" />
        <line y1="-5.5" y2="-10" opacity="0.84" transform="rotate(-60)" />
        <line y1="-5.5" y2="-10" opacity="0.76" transform="rotate(-90)" />
        <line y1="-5.5" y2="-10" opacity="0.68" transform="rotate(-120)" />
        <line y1="-5.5" y2="-10" opacity="0.6" transform="rotate(-150)" />
        <line y1="-5.5" y2="-10" opacity="0.52" transform="rotate(-180)" />
        <line y1="-5.5" y2="-10" opacity="0.44" transform="rotate(-210)" />
        <line y1="-5.5" y2="-10" opacity="0.36" transform="rotate(-240)" />
        <line y1="-5.5" y2="-10" opacity="0.28" transform="rotate(-270)" />
        <line y1="-5.5" y2="-10" opacity="0.2" transform="rotate(-300)" />
        <line y1="-5.5" y2="-10" opacity="0.2" transform="rotate(-330)" />
      </g>
    </svg>
    <p id="status">Loading the gallery, about 5.5 MB…</p>
    <noscript><p>The gallery runs as WebAssembly and needs JavaScript. See <a href="https://github.com/yldm-tech/mygo-kubai-icons">the repository</a>.</p></noscript>
    <script src="wasm_exec.js"></script>
    <script>
      // The page speaks Chinese to a browser that prefers it, as the gallery does (it follows the same languages through MyGo).
      const zh = /^zh/i.test(navigator.languages?.[0] || navigator.language || "")
      const say = zh
        ? { loading: "正在加载图库，约 5.5 MB…", failed: "图库加载失败：", repo: "查看仓库。" }
        : { loading: "Loading the gallery, about 5.5 MB…", failed: "The gallery did not load: ", repo: "See the repository." }
      if (zh) document.documentElement.lang = "zh-CN"
      document.getElementById("status").textContent = say.loading
      // The module is published gzip-compressed and inflated here, so the download stays about 5.5 MB whether or not the host compresses it.
      async function load() {
        const res = await fetch("gallery.wasm.gz")
        if (!res.ok) throw new Error(`gallery.wasm.gz: HTTP ${res.status}`)
        const wasm = new Response(res.body.pipeThrough(new DecompressionStream("gzip")), { headers: { "Content-Type": "application/wasm" } })
        const go = new Go()
        go.argv = ["gallery"]
        const { instance } = await WebAssembly.instantiateStreaming(wasm, go.importObject)
        go.run(instance)
      }
      load().catch((e) => {
        const p = document.createElement("p")
        p.className = "error"
        p.append(say.failed + e.message + (zh ? "。" : ". "))
        const a = document.createElement("a")
        a.href = "https://github.com/yldm-tech/mygo-kubai-icons"
        a.textContent = say.repo
        p.append(a)
        document.body.replaceChildren(p)
      })
    </script>
  </body>
</html>
